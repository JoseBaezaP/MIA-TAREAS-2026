[project]
name = "vetrag"
version = "0.1.0"
description = "Agente veterinario con RAG agéntico (LangGraph + pgvector + Voyage AI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "pypdfium2>=4.30",
]

[project.scripts]
vetrag-clasificar = "vetrag.clasificacion.__main__:main"
vetrag-ingesta = "vetrag.ingesta.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vetrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (PEP 8)
    "F",       # pyflakes
    "I",       # orden de imports
    "N",       # nombres PEP 8
    "UP",      # sintaxis moderna de Python
    "B",       # bugbear: errores comunes
    "SIM",     # simplificaciones
    "PTH",     # usar pathlib
    "RUF",
]
ignore = [
    "SIM905",  # listas largas de palabras son más legibles como "texto".split()
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
