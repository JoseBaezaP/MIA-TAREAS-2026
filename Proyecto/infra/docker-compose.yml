# VetRAG en el servidor: la app (FastAPI + frontend) y su base de datos (PostgreSQL + pgvector).
# Uso (desde infra/):  docker compose up -d --build
name: vetrag

services:
  db:
    # Contenedor PROPIO de VetRAG, separado de la base de otros proyectos (p. ej. Laravel).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Ajustado para un servidor de 2 GB compartido con otro sitio (Laravel + MariaDB):
    # - shared_buffers: caché propia de PostgreSQL (el resto lo cachea el sistema operativo).
    # - effective_cache_size: cuánta memoria cree que hay para caché (planificación de consultas).
    # - maintenance_work_mem: memoria para reconstruir el índice HNSW al restaurar el respaldo.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=900MB
      - -c
      - maintenance_work_mem=384MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=30
    # Límite duro: si VetRAG pide demasiada memoria, Docker frena a VetRAG, no a MariaDB/Laravel.
    mem_limit: 1100m
    # Memoria compartida (/dev/shm). Docker da solo 64 MB por defecto, y PostgreSQL la usa para
    # construir el índice HNSW en paralelo (necesita ~maintenance_work_mem). Sin esto, restaurar
    # falla con "could not resize shared memory segment … No space left on device".
    shm_size: 512mb
    environment:
      POSTGRES_DB: vetrag
      POSTGRES_USER: vetrag
      POSTGRES_PASSWORD: ${VETRAG_DB_PASSWORD:?Falta VETRAG_DB_PASSWORD en infra/.env}
    volumes:
      - vetrag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetrag -d vetrag"]
      interval: 10s
      retries: 10
    # Sin "ports": la base SOLO es accesible desde la red interna de este compose.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      VETRAG_DATABASE_URL: postgresql://vetrag:${VETRAG_DB_PASSWORD}@db:5432/vetrag
      VETRAG_COOKIE_SEGURA: "true"  # la cookie de sesión solo viaja por HTTPS
    ports:
      # Solo en 127.0.0.1: desde internet se entra por nginx (HTTPS), nunca directo.
      - "127.0.0.1:${VETRAG_PUERTO:-8000}:8000"
    mem_limit: 450m
    depends_on:
      db:
        condition: service_healthy

volumes:
  vetrag-pgdata:
