# Bloque de nginx para VetRAG. Copiar a /etc/nginx/sites-available/vetrag, cambiar el dominio,
# enlazar en sites-enabled y obtener el certificado con:
#   sudo certbot --nginx -d vetrag.TU-DOMINIO.com
# (certbot agrega solo las líneas de HTTPS y la redirección desde HTTP).
server {
    listen 80;
    server_name vetrag.TU-DOMINIO.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat en streaming (Server-Sent Events): nginx NO debe acumular la respuesta, o los pasos
    # del agente ("Buscando…", "8 fragmentos…") llegarían todos juntos al final.
    location /api/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
